<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loops</title>
</head>
<body>
    <p> fãs do aboubakar, APERTEM F12</p>

    <script>
        //lacos repeticao
        
        for(let i=5; i>0; i--){
            console.log("i", i);
        }
        const craques = ['borre', 'enner', 'thiago galhardo', 'nico lopes', 'abel hernandez']
        for (craque of craques){
            console.log('sou fã do:', craque)
        }

        let contador = 0;
        while(contador < 5){
            console.log('eu tenho ', contador, 'fãs')   
            contador++
        }
    </script>
</body>
</html>
